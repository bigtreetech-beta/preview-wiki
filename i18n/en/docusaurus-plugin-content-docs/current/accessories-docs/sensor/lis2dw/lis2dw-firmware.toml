## 编译 Klipper 固件
'''
translate = '''
##  Klipper
'''

[[block]]
key = "1b4a9a91ac4d0d89"
origin = '''

使用 ssh 连接到 Klipper Host. 然后使用以下命令进入 Klipper 目录。并且使用 `make menuconfig` 配置固件。
'''
translate = '''
SSH
'''

[[block]]
key = "a18bfc19c771a8e5"
origin = '''

``` shell
cd ~/klipper
make menuconfig 
```
'''
translate = '''

``` shell
cd ~/klipper
make menuconfig 
```
'''

[[block]]
key = "9b871476564dbf61"
origin = '''

<ImageView src={require('./img/lis2dw-firmware-config.png').default} width="80%"/>
'''
translate = '''

<ImageView src={require('@site/docs/accessories-docs/sensor/lis2dw/img/lis2dw-firmware-config.png').default} width="80%"/>
'''

[[block]]
key = "0dfc9894b0cc8781"
origin = '''

当配置完成使用 `q` 来退出。使用 `y` 来保存编译选项。
'''
translate = '''
When I
'''

[[block]]
key = "50157bdc559de387"
origin = '''

然后使用 `make` 命令来开始编译 Klipper 固件
'''
translate = '''
My `make` Command
'''

