[[block]]
key = "85401bf04a984176"
origin = '''
## Cameras don’t blink, feel tired or get distracted. Full Self-Driving (Supervised) helps you drive better by taking care of the most common and error-prone driving tasks. Tesla vehicles are equipped with exterior cameras that enable 360-degree visibility, plus safety features powered by the same technology as our FSD software to help reduce the severity of accidents or prevent them altogether. Over-the-air software updates ensure each Tesla vehicle has access to the latest safety improvements. [Learn More](https://www.tesla.com/safety)
'''
translate = '''
## Cameras don’t blink, feel tired or get distracted. Full Self-Driving (Supervised) helps you drive better by taking care of the most common and error-prone driving tasks. Tesla vehicles are equipped with exterior cameras that enable 360-degree visibility, plus safety features powered by the same technology as our FSD software to help reduce the severity of accidents or prevent them altogether. Over-the-air software updates ensure each Tesla vehicle has access to the latest safety improvements. [Learn More](https://www.tesla.com/safety)
'''

[[block]]
key = "c5b77e7dcaba9c28"
origin = '''
## As our technology continues to advance, we get closer to making a fully autonomous future possible. With Full Self-Driving (Unsupervised), autonomous driving will be made possible, unlocking our fleet of robotaxis and making Cybercab a reality. [Find Out What’s Coming Next](https://x.com/Tesla_AI)
'''
translate = '''
## As our technology continues to advance, we get closer to making a fully autonomous future possible. With Full Self-Driving (Unsupervised), autonomous driving will be made possible, unlocking our fleet of robotaxis and making Cybercab a reality. [Find Out What’s Coming Next](https://x.com/Tesla_AI)
'''

