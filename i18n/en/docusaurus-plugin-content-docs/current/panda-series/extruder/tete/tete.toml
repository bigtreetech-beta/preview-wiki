origin = '''
断开 485 连接线与电源连接线，随后取出 AMS 主框架组件。
'''
translate = '''
Disconnect the 485 communication cable and the power cable, then remove the AMS main frame assembly.
'''

[[block]]
key = "5355fa7407691a6c"
origin = '''
### 安装 AMS 替换主板
'''
translate = '''
### Install AMS to replace the mainboard
'''

[[block]]
key = "bf5b9bdd8d6f46ea"
origin = '''
拆下原厂 AMS 电源主板，安装包装内的 **AMS 替换主板**。固定替换主板时，请在螺帽一侧加入尼龙垫片，避免过度拧紧导致主板损伤。
'''
translate = '''
Remove the original AMS power mainboard and install the AMS replacement mainboard included in the package. When securing the replacement mainboard, place a nylon washer on the nut side to prevent damage to the mainboard from over-tightening.
'''

