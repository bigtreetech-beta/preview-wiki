name: Deploy to Self-Hosted Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      # Self-hosted runners in this environment often fail HTTPS clone with:
      #   GnuTLS recv error (-110): The TLS connection was non-properly terminated
      # Prefer SSH; fall back to HTTPS with retries + HTTP/1.1.
      - name: Checkout repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          export HOME=/home/runner
          echo "HOME=$HOME"
          #Safely assign default values using ${VAR:-default}
          DEST="${GITHUB_WORKSPACE:-/data/actions-runner-preview/_work/preview-wiki/preview-wiki}"
          BRANCH="${GITHUB_REF_NAME:-main}"
          REPO="${GITHUB_REPOSITORY:-bigtreetech-beta/preview-wiki}"
          TOKEN="${GITHUB_TOKEN:-}"
          
          SSH_URL="git@github.com:${REPO}.git"
          HTTPS_URL="https://x-access-token:${TOKEN}@github.com/${REPO}.git"

          env
          whoami
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 524288000
          
          mkdir -p "$DEST"
          cd "$DEST"

          clone_once() {
            local url="$1"
            rm -rf .git
            find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            git clone --depth 1 --branch "$BRANCH" "$url" .
          }

          ok=0
          for i in 1 2 3 4 5; do
            echo "Checkout attempt ${i}/5 (ssh)..."
            if clone_once "$SSH_URL"; then ok=1; break; fi
            echo "Checkout attempt ${i}/5 (https)..."
            if clone_once "$HTTPS_URL"; then ok=1; break; fi
            sleep $((i * 5))
          done
          if [ "$ok" -ne 1 ]; then
            echo "Failed to checkout ${REPO}@${BRANCH} after retries"
            exit 128
          fi
          git log -1 --oneline

      - name: Build Wiki
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

          # Repo uses Yarn Berry (see packageManager / yarn.lock). Avoid Yarn 1.
          corepack enable
          corepack prepare yarn@4.17.1 --activate
          rm -rf .docusaurus build
          yarn install --immutable
          yarn run build
      
      - name: Build Wiki & Update Docusaurus
        working-directory: /data/wiki
        run: |          
          WIKIDIR="/data/wiki/preview-wiki-dirs/wiki-cms-main-$(date -I)-$(date +%s)/"
          sudo chown -R wiki /data
          mkdir -p ${WIKIDIR}
          cp -fr "${GITHUB_WORKSPACE}/."  ${WIKIDIR}
          ln -fsn ${WIKIDIR} /data/wiki/preview-wiki
          sudo chown -R wiki /data/wiki/preview-wiki
          sudo systemctl restart docusaurus
          # Record Version
          echo "${WIKIDIR}" >>/data/wiki/preview-wiki-version.log

    
      - name: Delete History Directory
        working-directory: /data/wiki
        run: |
           lastversion=$(sed -n '11p' preview-wiki-version.log)
           [ -z ${lastversion} ] && exit 0
           for version in $(sed -n '11,$p' preview-wiki-version.log)
           do
               [ -d ${version} ] && rm -fr ${version}
           done
